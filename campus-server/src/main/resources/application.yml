server:
  port: 8080

spring:
  profiles:
    active: dev
  datasource:
    druid:
      driver-class-name: ${campus.datasource.driver-class-name}
      url: jdbc:mysql://${campus.datasource.host}:${campus.datasource.port}/${campus.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${campus.datasource.username}
      password: ${campus.datasource.password}
  redis:
    host: ${campus.redis.host}
    port: ${campus.redis.port}
    password: ${campus.redis.password}
    database: ${campus.redis.database}

  #添加文件上传大小限制，覆盖默认的1MB
  servlet:
    multipart:
      # 单个文件最大10MB，满足你页面2M的要求，留足余量
      max-file-size: 10MB
      # 单次请求最大10MB，支持多文件上传
      max-request-size: 10MB

mybatis:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.campus.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      campus:
        mapper: debug
        service: info
        controller: info

campus:
  jwt:
    # 设置jwt签名加密时使用的秘钥
    admin-secret-key: itcast
    # 设置jwt过期时间
    admin-ttl: 7200000
    # 设置前端传递过来的令牌名称
    admin-token-name: token

    user-secret-key: vievolet
    user-ttl: 7200000
    user-token-name: authentication
  rustfs:
    endpoint: ${campus.rustfs.endpoint}
    access-key: ${campus.rustfs.access-key}
    secret-key: ${campus.rustfs.secret-key}
    bucket-name: ${campus.rustfs.bucket-name}
  wechat:
    appid: ${campus.wechat.appid}
    secret: ${campus.wechat.secret}
  pay:
    # 支付网关模式：mock = 模拟支付（默认，个人开发者无微信商户号）；real = 真实微信支付V3（需配置商户号/证书）
    mode: mock
    # mock 模式下调用支付接口即视为支付成功（模拟真实回调）；false 时需手动调 /user/order/payment/mock-notify 模拟回调
    mock-auto-pay: true
  order:
    # 订单支付超时时间（毫秒），默认30分钟；演示时可临时改小（如 60000）快速观察延时关单
    pay-timeout-ms: 1800000
  ai:
    # AI 点餐推荐（DeepSeek，OpenAI 兼容协议，换任意兼容厂商只需改这三个配置）
    base-url: https://api.deepseek.com
    model: deepseek-chat
    # API Key 通过环境变量 CAMPUS_AI_API_KEY 注入；未配置时推荐接口自动降级为规则推荐
    api-key: ${CAMPUS_AI_API_KEY:}
    timeout-ms: 30000


